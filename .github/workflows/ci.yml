name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Package builds first: hosts resolve published entry points (e.g. pupitre-ui styles.css) from build/.
      - run: npm run build
      - run: cp .env.example .env && node ace generate:key && node ace build --ignore-ts-errors
        working-directory: apps/example
      - run: npm run bundle:budget
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:exports
      - run: npm run registry:check

  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pupitre
          POSTGRES_PASSWORD: pupitre
          POSTGRES_DB: pupitre_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pupitre:pupitre@localhost:5432/pupitre_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: DB=pg npm run quick:test -w packages/pupitre

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: cp .env.example .env && node ace generate:key && node ace build --ignore-ts-errors
        working-directory: apps/example
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/example/tmp/playwright-report
